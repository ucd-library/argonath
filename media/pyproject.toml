[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dc"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "pydantic>=2.0",
    "httpx>=0.27",
    "openai>=1.0",
    "llama-index>=0.11",
    "llama-index-vector-stores-postgres>=0.2",
    "llama-index-embeddings-openai>=0.2",
    "psycopg2-binary>=2.9",
    "rdflib>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
dc = "dc.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["dc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=dc --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["dc"]
