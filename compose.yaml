include:
  - path: ../../project-anduin/compose.yaml

services:

  dc:
    build:
      context: ./media
      dockerfile: Dockerfile
    image: ${IMAGE_ARGONATH_DC:-argonath-dc:dev}
    env_file:
      - .env
    environment:
      - SAMWISE_API_KEY=${SAMWISE_API_KEY}
      - SAMWISE_API_URL=${SAMWISE_API_URL:-http://samwise.library.ucdavis.edu/api}
      - CASK_ROOT=${CASK_ROOT:-http://cask:3001}
      - DAGSTER_POSTGRES_HOST=postgres
      - DAGSTER_POSTGRES_DB=${DAGSTER_POSTGRES_DB:-dagster}
      - DAGSTER_POSTGRES_USER=postgres
    command: ["bash", "-c", "tail -f /dev/null"]

  dagster-argonath:
    image: ${IMAGE_PROJECT_ANDUIN_DAGSTER}
    env_file:
      - .env
    environment:
      - DAGSTER_POSTGRES_HOST=postgres
      - DAGSTER_POSTGRES_DB=${DAGSTER_POSTGRES_DB:-dagster}
      - DAGSTER_POSTGRES_USER=postgres
      - SAMWISE_API_KEY=${SAMWISE_API_KEY}
      - CASK_ROOT=${CASK_ROOT:-http://cask:3001}
    volumes:
      - ./dagster:/dagster
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3002", "-w", "/dagster/workspace.yaml"]
    ports:
      - "3002:3002"

  dagster-argonath-daemon:
    image: ${IMAGE_PROJECT_ANDUIN_DAGSTER}
    env_file:
      - .env
    environment:
      - DAGSTER_POSTGRES_HOST=postgres
      - DAGSTER_POSTGRES_DB=${DAGSTER_POSTGRES_DB:-dagster}
      - DAGSTER_POSTGRES_USER=postgres
      - SAMWISE_API_KEY=${SAMWISE_API_KEY}
      - CASK_ROOT=${CASK_ROOT:-http://cask:3001}
    volumes:
      - ./dagster:/dagster
    command: ["dagster-daemon", "run", "-w", "/dagster/workspace.yaml"]
